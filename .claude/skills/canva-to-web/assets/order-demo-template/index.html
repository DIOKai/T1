<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order Demo</title>
<style>
  :root { --bg:#f7f1ea; --ink:#2b1e16; --muted:#7a6a5e; --card:#fff; --accent:#8a5a3b; --on-accent:#fff; --line:#e6dbcf; --r:20px; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1612; --ink:#f4ece4; --muted:#b4a496; --card:#2a221c; --accent:#d9a27a; --on-accent:#1c1612; --line:#3d332b; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--ink); padding-bottom:96px; }
  header { padding:24px 16px 8px; } h1 { margin:0; font-size:1.6rem; } header p { margin:4px 0 0; color:var(--muted); }
  button { font:inherit; color:inherit; min-height:44px; min-width:44px; border-radius:12px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
  button:focus-visible, input:focus-visible + span, [tabindex]:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .primary { background:var(--accent); color:var(--on-accent); border:0; font-weight:600; padding:0 20px; }
  .carousel { display:flex; gap:16px; overflow-x:auto; scroll-snap-type:x mandatory; padding:16px; scrollbar-width:none; }
  .carousel::-webkit-scrollbar { display:none; }
  .card { flex:0 0 78%; max-width:340px; scroll-snap-align:center; background:var(--card); border-radius:var(--r); padding:20px; box-shadow:0 6px 24px rgb(0 0 0 / .08); transition:transform .3s, opacity .3s; }
  .card:not(.current) { transform:scale(.94); opacity:.7; }
  .cup { width:96px; height:120px; margin:0 auto 16px; border-radius:12px 12px 36px 36px; background:var(--c); box-shadow:inset 0 -18px 0 rgb(0 0 0 / .15); }
  .card h2 { margin:0 0 4px; font-size:1.2rem; } .card p { margin:0 0 12px; color:var(--muted); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .nav { display:flex; justify-content:center; align-items:center; gap:16px; color:var(--muted); }
  .bar { position:fixed; inset:auto 0 0 0; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--line); display:flex; justify-content:flex-end; }
  .badge { display:inline-block; min-width:24px; padding:0 6px; border-radius:12px; background:var(--on-accent); color:var(--accent); margin-left:8px; }
  .bump { animation:bump .35s; } @keyframes bump { 50% { transform:scale(1.3); } }
  dialog { width:100%; max-width:520px; margin:auto auto 0; border:0; border-radius:var(--r) var(--r) 0 0; padding:20px 16px; background:var(--card); color:var(--ink); max-height:88vh; }
  dialog[open] { animation:up .28s ease-out; } @keyframes up { from { transform:translateY(40px); opacity:0; } }
  dialog::backdrop { background:rgb(0 0 0 / .4); }
  fieldset { border:0; padding:0; margin:0 0 16px; } legend { font-weight:600; margin-bottom:8px; }
  .seg { display:flex; flex-wrap:wrap; gap:8px; }
  .seg label { position:relative; } .seg input { position:absolute; opacity:0; inset:0; }
  .seg span { display:inline-flex; align-items:center; min-height:44px; padding:0 14px; border:1px solid var(--line); border-radius:12px; cursor:pointer; }
  .seg input:checked + span { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .stepper { display:flex; align-items:center; gap:8px; } .stepper output { min-width:24px; text-align:center; }
  ul.cart { list-style:none; padding:0; margin:0 0 16px; } ul.cart li { padding:10px 0; border-bottom:1px solid var(--line); }
  .muted { color:var(--muted); font-size:.9rem; }
  .done { text-align:center; } .done svg { width:120px; height:120px; }
  .done circle { stroke:var(--accent); stroke-width:6; fill:none; animation:pop .5s ease-out; transform-origin:center; }
  .done path { stroke:var(--accent); stroke-width:8; fill:none; stroke-linecap:round; stroke-dasharray:60; stroke-dashoffset:60; animation:draw .45s .45s forwards; }
  @keyframes pop { from { transform:scale(.4); opacity:0; } } @keyframes draw { to { stroke-dashoffset:0; } }
  @media (prefers-reduced-motion: reduce) {
    .card, .card:not(.current) { transform:none; transition:opacity .2s; }
    .carousel { scroll-behavior:auto; }
    .bump { animation:none; background:var(--ink); color:var(--bg); }
    dialog[open] { animation:fade .2s; }
    .done circle { animation:fade .3s; } .done path { stroke-dashoffset:0; animation:fade .3s; }
    @keyframes fade { from { opacity:0; } }
  }
</style>
</head>
<body>
<header><h1 id="shop">Menu</h1><p id="tagline"></p></header>
<main>
  <section id="carousel" class="carousel" tabindex="0" aria-roledescription="carousel" aria-label="Drinks. Use left and right arrow keys."></section>
  <div class="nav">
    <button id="prev" aria-label="Previous drink">‹</button>
    <span id="pos" aria-live="polite"></span>
    <button id="next" aria-label="Next drink">›</button>
  </div>
  <p class="muted" style="text-align:center">Demo only — no payment, no real order.</p>
</main>
<div class="bar"><button id="cartBtn" class="primary">Cart<span id="badge" class="badge">0</span></button></div>

<dialog id="custom" aria-labelledby="cTitle">
  <form method="dialog" id="customForm">
    <div class="row"><h2 id="cTitle">Drink</h2><button value="cancel" aria-label="Close">✕</button></div>
    <fieldset><legend>Size</legend><div class="seg" id="sizes"></div></fieldset>
    <fieldset><legend>Sweetness</legend><div class="seg" id="sweet"></div></fieldset>
    <fieldset id="milkSet"><legend>Milk</legend><div class="seg" id="milks"></div></fieldset>
    <fieldset><legend>Toppings</legend><div id="tops"></div></fieldset>
    <div class="row"><div class="stepper"><button type="button" id="qMinus" aria-label="Fewer cups">−</button><output id="qty" aria-live="polite">1</output><button type="button" id="qPlus" aria-label="More cups">+</button></div>
    <button type="button" id="addBtn" class="primary">Add</button></div>
  </form>
</dialog>

<dialog id="cart" aria-labelledby="cartTitle">
  <div class="row"><h2 id="cartTitle">Your order</h2><button id="cartClose" aria-label="Close">✕</button></div>
  <ul class="cart" id="cartList"></ul>
  <p id="empty" class="muted">Your cart is empty — swipe through the drinks and tap Customise.</p>
  <div class="row"><strong id="total"></strong><button id="placeBtn" class="primary">Place order (demo)</button></div>
</dialog>

<dialog id="done" aria-labelledby="doneTitle">
  <div class="done">
    <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44"/><path d="M30 52 l14 14 l26 -30"/></svg>
    <h2 id="doneTitle">Order received</h2>
    <p id="doneMsg" role="status"></p>
    <button id="doneClose" class="primary">Back to menu</button>
  </div>
</dialog>
<script src="app.js"></script>
</body>
</html>
