<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Walkthrough</title>
  <style>
    :root { --ui: rgba(20, 22, 26, .72); --fg: #f4f4f2; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: var(--fg);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    canvas { display: block; touch-action: none; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
      background: #111; padding: 16px; z-index: 5; }
    #status.hidden { display: none; }
    #room { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; padding: 6px 12px;
      border-radius: 999px; background: var(--ui); backdrop-filter: blur(8px); pointer-events: none; }
    #room:empty { display: none; }
    #hint { position: fixed; bottom: 16px; left: 50%; translate: -50% 0; padding: 6px 12px;
      border-radius: 8px; background: var(--ui); pointer-events: none; }
    #hotspots { position: fixed; inset: 0; pointer-events: none; }
    .hotspot { position: absolute; translate: -50% -50%; pointer-events: auto; cursor: pointer;
      border: 0; border-radius: 999px; padding: 6px 12px; background: var(--ui); color: var(--fg);
      font: inherit; white-space: nowrap; }
    .hotspot:hover, .hotspot:focus-visible { background: #fff; color: #111; outline: none; }
    #stick { position: fixed; left: max(20px, env(safe-area-inset-left)); bottom: max(28px, env(safe-area-inset-bottom));
      width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.3); touch-action: none; display: none; }
    #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
      border-radius: 50%; background: rgba(255,255,255,.55); }
    @media (pointer: coarse) { #stick { display: block; } #hint { display: none; } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="status">Loading…</div>
  <div id="hotspots"></div>
  <div id="room"></div>
  <div id="hint">Click to look around · WASD to walk · Shift to hurry · 1–9 hotspots · Esc to release</div>
  <div id="stick" aria-hidden="true"><div id="knob"></div></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
